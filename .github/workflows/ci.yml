# Checks every push and pull request: schema, syntax and the unit tests.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate GSettings schema
        run: |
          sudo apt-get install -y --no-install-recommends libglib2.0-bin >/dev/null
          glib-compile-schemas --strict --dry-run schemas/

      - name: Check syntax
        run: |
          for f in *.js core/*.js lib/*.js providers/*.js ui/*.js; do
            cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || exit 1
          done

      - name: Run unit tests
        run: npm test
